name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  ZIG_VERSION: "0.16.0"

jobs:
  # ============================================
  # Build and test Zig code
  # ============================================
  zig-build:
    name: Zig Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        # Running the suite on windows-latest needs the tests' hardcoded /tmp
        # paths replaced first — there are about six hundred of them. Until then
        # the windows-build job below at least keeps the code compiling there.

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build
        run: zig build

      - name: Run unit tests
        run: zig build test

      - name: Run integration tests
        run: zig build integration-test

      - name: Run crash-recovery tests
        run: zig build crash-test

      - name: Run deterministic fuzz corpus
        run: zig build fuzz

      # Compile-only. The benchmarks are built by no other step, so an API they
      # use can be removed and every check stays green; benchmark.yml runs on
      # tags, which made a release the first place that showed up.
      - name: Compile benchmarks
        run: zig build benchmark-build

      - name: Build shared library
        run: |
          case "${{ matrix.os }}-$(uname -m)" in
            ubuntu-latest-x86_64) target="x86_64-linux-gnu" ;;
            macos-14-arm64) target="aarch64-macos" ;;
            macos-14-x86_64) target="x86_64-macos" ;;
            *)
              echo "Unsupported CI shared library target: ${{ matrix.os }}-$(uname -m)" >&2
              exit 1
              ;;
          esac
          zig build shared -Dtarget="$target" -Doptimize=ReleaseSafe

      - name: Upload shared library
        uses: actions/upload-artifact@v4
        with:
          name: shared-lib-${{ matrix.os }}
          path: zig-out/lib/

  # ============================================
  # Python tests
  # ============================================
  python-test:
    name: Python Tests
    needs: zig-build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python-version: ['3.9', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Download shared library
        uses: actions/download-artifact@v4
        with:
          name: shared-lib-${{ matrix.os }}
          path: zig-out/lib

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          cd bindings/python
          pip install -e ".[dev]"

      - name: Run tests
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11') }}
        run: |
          cd bindings/python
          LATTICE_LIB_PATH=$GITHUB_WORKSPACE/zig-out/lib pytest -v

      - name: Run tests with coverage gate
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11' }}
        run: |
          cd bindings/python
          LATTICE_LIB_PATH=$GITHUB_WORKSPACE/zig-out/lib \
            pytest -v --cov=src/latticedb --cov-report=term --cov-fail-under=85

  # ============================================
  # TypeScript tests
  # ============================================
  typescript-test:
    name: TypeScript Tests
    needs: zig-build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        node-version: ['18', '20']

    steps:
      - uses: actions/checkout@v4

      - name: Download shared library
        uses: actions/download-artifact@v4
        with:
          name: shared-lib-${{ matrix.os }}
          path: zig-out/lib

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        working-directory: bindings/typescript
        run: npm ci --ignore-scripts

      - name: Build TypeScript
        working-directory: bindings/typescript
        run: npm run build

      - name: Run tests
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.node-version == '20') }}
        working-directory: bindings/typescript
        env:
          LATTICE_LIB_PATH: ${{ github.workspace }}/zig-out/lib
        run: npm test -- --runInBand

      - name: Run tests with coverage gate
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node-version == '20' }}
        working-directory: bindings/typescript
        env:
          LATTICE_LIB_PATH: ${{ github.workspace }}/zig-out/lib
        run: npm run test:coverage -- --runInBand --coverageReporters=text-summary

  # ============================================
  # Go tests
  # ============================================
  go-test:
    name: Go Repo-Local Tests
    needs: zig-build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]

    steps:
      - uses: actions/checkout@v4

      - name: Download shared library
        uses: actions/download-artifact@v4
        with:
          name: shared-lib-${{ matrix.os }}
          path: zig-out/lib

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: bindings/go/go.mod

      - name: Run tests
        working-directory: bindings/go
        run: go test -tags repolocal ./...

  # ============================================
  # Java tests
  # ============================================
  java-test:
    name: Java Tests
    needs: zig-build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]

    steps:
      - uses: actions/checkout@v4

      - name: Download shared library
        uses: actions/download-artifact@v4
        with:
          name: shared-lib-${{ matrix.os }}
          path: zig-out/lib

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: bindings/java/pom.xml

      - name: Run tests
        working-directory: bindings/java
        run: mvn --batch-mode clean test

  # ============================================
  # Go installed workflow smoke test
  # ============================================
  go-pkgconfig-test:
    name: Go Installed Workflow
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: bindings/go/go.mod

      - name: Build installed development layout
        run: zig build install --prefix /tmp/lattice-install -Doptimize=ReleaseSafe

      - name: Run installed-workflow tests
        working-directory: bindings/go
        env:
          PKG_CONFIG_PATH: /tmp/lattice-install/lib/pkgconfig
          LD_LIBRARY_PATH: /tmp/lattice-install/lib
        run: go test ./...

  # ============================================
  # Windows cross-compilation
  #
  # This proves the code type-checks for Windows, which is what regressed before
  # and what is cheap to protect. It does not prove the REPL behaves on a real
  # console: whether the terminal delivers the escape sequences the decoder
  # expects, and whether Ctrl-C and encoding do the right thing, can only be
  # learned by running there. That needs the test suite to stop assuming /tmp.
  # ============================================
  windows-build:
    name: Windows Cross-Compile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build for x86_64-windows
        run: zig build -Dtarget=x86_64-windows-gnu

      - name: Build for aarch64-windows
        run: zig build -Dtarget=aarch64-windows-gnu

  # ============================================
  # Go conformance suite
  # ============================================
  conformance-go-test:
    name: Go Conformance Suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: conformance/go/go.mod
          cache: false

      - name: Build installed development layout
        run: zig build install --prefix /tmp/lattice-install -Doptimize=ReleaseSafe

      - name: Run conformance suite
        working-directory: conformance/go
        env:
          PKG_CONFIG_PATH: /tmp/lattice-install/lib/pkgconfig
          LD_LIBRARY_PATH: /tmp/lattice-install/lib
        run: go test ./...

  # ============================================
  # Lint checks
  # ============================================
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python linters
        working-directory: bindings/python
        run: pip install -e ".[dev]"

      - name: Run ruff
        working-directory: bindings/python
        run: ruff check src/

      - name: Run mypy
        working-directory: bindings/python
        run: mypy src/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install TypeScript dependencies
        working-directory: bindings/typescript
        run: npm ci --ignore-scripts

      - name: Run ESLint
        working-directory: bindings/typescript
        run: npm run lint
