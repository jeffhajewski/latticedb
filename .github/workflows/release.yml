name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (without v prefix)'
        required: true
        type: string
      publish_pypi:
        description: 'Publish to PyPI'
        type: boolean
        default: false
      publish_npm:
        description: 'Publish to npm'
        type: boolean
        default: false

env:
  ZIG_VERSION: "0.16.0"

jobs:
  # ============================================
  # Verify version consistency before building
  # ============================================
  version-check:
    name: Version Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine expected version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Check all tracked versions
        run: python3 scripts/bump_version.py --check "${{ steps.version.outputs.version }}" --strict-lockfile

      - name: Check Zig version
        run: |
          ZIG_VERSION=$(grep 'const version' build.zig | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Zig version: $ZIG_VERSION"
          echo "Expected: ${{ steps.version.outputs.version }}"
          if [ "$ZIG_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "ERROR: build.zig version ($ZIG_VERSION) does not match tag (${{ steps.version.outputs.version }})"
            exit 1
          fi

      - name: Check Python version
        run: |
          PYTHON_VERSION=$(grep '^version' bindings/python/pyproject.toml | sed -E 's/[^"]*"([^"]+)".*/\1/')
          echo "Python version: $PYTHON_VERSION"
          echo "Expected: ${{ steps.version.outputs.version }}"
          if [ "$PYTHON_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "ERROR: pyproject.toml version ($PYTHON_VERSION) does not match tag (${{ steps.version.outputs.version }})"
            exit 1
          fi

      - name: Check npm version
        run: |
          NPM_VERSION=$(grep '"version"' bindings/typescript/package.json | head -1 | sed -E 's/.*"version": "([^"]+)".*/\1/')
          echo "npm version: $NPM_VERSION"
          echo "Expected: ${{ steps.version.outputs.version }}"
          if [ "$NPM_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "ERROR: package.json version ($NPM_VERSION) does not match tag (${{ steps.version.outputs.version }})"
            exit 1
          fi

      - name: Check Zig header version
        run: |
          HDR_VERSION=$(grep 'LATTICE_VERSION ' include/lattice.h | sed -E 's/.*"([^"]+)".*/\1/')
          echo "C header version: $HDR_VERSION"
          echo "Expected: ${{ steps.version.outputs.version }}"
          if [ "$HDR_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "ERROR: include/lattice.h version ($HDR_VERSION) does not match tag (${{ steps.version.outputs.version }})"
            exit 1
          fi

      - name: Check Zig source version
        run: |
          SRC_VERSION=$(grep '^pub const VERSION = ' src/main.zig | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Zig source version: $SRC_VERSION"
          echo "Expected: ${{ steps.version.outputs.version }}"
          if [ "$SRC_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "ERROR: src/main.zig version ($SRC_VERSION) does not match tag (${{ steps.version.outputs.version }})"
            exit 1
          fi

      - name: Versions OK
        run: echo "All version files match tag ${{ steps.version.outputs.version }}"

  # ============================================
  # Build native binaries for all platforms
  # ============================================
  build-native:
    name: Build Native Libraries
    needs: version-check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - x86_64-macos
          - aarch64-macos
          - x86_64-windows-gnu
          - aarch64-windows-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build shared library
        run: |
          mkdir -p dist/build/${{ matrix.target }}/{bin,lib,include}
          mkdir -p dist/build/${{ matrix.target }}/lib/pkgconfig

          zig build shared \
            -Dtarget=${{ matrix.target }} \
            -Doptimize=ReleaseFast

          # Copy to target directory
          cp zig-out/lib/liblattice.* dist/build/${{ matrix.target }}/lib/ || true
          cp zig-out/lib/lattice.* dist/build/${{ matrix.target }}/lib/ || true
          # Windows keeps the DLL beside the executables and leaves only the
          # import library under lib/. Everything downstream looks in lib/, so
          # the DLL goes there too.
          cp zig-out/bin/lattice.dll dist/build/${{ matrix.target }}/lib/ || true
          cp zig-out/lib/pkgconfig/lattice.pc dist/build/${{ matrix.target }}/lib/pkgconfig/ || true

      - name: Build CLI
        run: |
          zig build cli \
            -Dtarget=${{ matrix.target }} \
            -Doptimize=ReleaseFast

          # Named rather than globbed: on Windows zig-out/bin also holds the
          # shared library and a 10 MB debug database, neither of which belongs
          # in the CLI directory of the archive.
          case "${{ matrix.target }}" in
            *-windows-*) cli=lattice.exe ;;
            *) cli=lattice ;;
          esac
          cp "zig-out/bin/$cli" "dist/build/${{ matrix.target }}/bin/$cli"

      - name: Copy header
        run: cp include/lattice.h dist/build/${{ matrix.target }}/include/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: dist/build/${{ matrix.target }}

  # ============================================
  # Smoke test Go binding against packaged native artifact
  # ============================================
  smoke-test-go:
    name: Go Smoke Test
    needs: build-native
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download Linux x86_64 native library
        uses: actions/download-artifact@v4
        with:
          name: native-x86_64-linux-gnu
          path: native-lib

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: bindings/go/go.mod

      - name: Verify pkg-config metadata exists
        run: test -f native-lib/lib/pkgconfig/lattice.pc

      - name: Run Go smoke test
        working-directory: bindings/go
        env:
          PKG_CONFIG_PATH: ${{ github.workspace }}/native-lib/lib/pkgconfig
          LD_LIBRARY_PATH: ${{ github.workspace }}/native-lib/lib
        run: go test ./...

  # ============================================
  # Run extracted black-box conformance suite
  # before publishing any release artifacts
  # ============================================
  conformance-go-test:
    name: Go Conformance Suite
    needs: version-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: conformance/go/go.mod
          cache: false

      - name: Build installed development layout
        run: zig build install --prefix /tmp/lattice-install -Doptimize=ReleaseSafe

      - name: Run conformance suite
        working-directory: conformance/go
        env:
          PKG_CONFIG_PATH: /tmp/lattice-install/lib/pkgconfig
          LD_LIBRARY_PATH: /tmp/lattice-install/lib
        run: go test ./...

  # ============================================
  # Create GitHub Release with tarballs
  # ============================================
  release-github:
    name: GitHub Release
    needs: [version-check, build-native, smoke-test-go, conformance-go-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: dist/build

      - name: Reorganize artifacts
        run: |
          mkdir -p dist/build-final
          for dir in dist/build/native-*; do
            target=$(basename "$dir" | sed 's/native-//')
            mv "$dir" "dist/build-final/$target"
          done
          rm -rf dist/build
          mv dist/build-final dist/build

      - name: Create release packages
        run: |
          VERSION=${{ steps.version.outputs.version }}
          mkdir -p dist/release

          for target_dir in dist/build/*; do
            target=$(basename "$target_dir")

            case "$target" in
              *-windows-*)
                # Zip, which a Windows user can open without installing
                # anything first.
                archive="latticedb-${VERSION}-${target}.zip"
                echo "Creating $archive..."
                staging="dist/staging/latticedb-${VERSION}"
                rm -rf dist/staging
                mkdir -p "$staging"
                cp -R "$target_dir/." "$staging/"
                (cd dist/staging && zip -qr "${GITHUB_WORKSPACE}/dist/release/$archive" "latticedb-${VERSION}")
                rm -rf dist/staging
                ;;
              *)
                archive="latticedb-${VERSION}-${target}.tar.gz"
                echo "Creating $archive..."
                tar -czf "dist/release/$archive" -C "$target_dir" --transform "s,^,latticedb-${VERSION}/," .
                ;;
            esac
          done

          # Generate checksums
          cd dist/release
          shopt -s nullglob
          shasum -a 256 *.tar.gz *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: LatticeDB v${{ steps.version.outputs.version }}
          files: dist/release/*
          generate_release_notes: true
          draft: ${{ github.event_name == 'workflow_dispatch' }}

  # ============================================
  # Build Python wheels for each platform
  # ============================================
  build-wheels:
    name: Build Wheel (${{ matrix.target }})
    needs: build-native
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux-gnu
            python_platform: manylinux_2_17_x86_64
          - os: ubuntu-latest
            target: aarch64-linux-gnu
            python_platform: manylinux_2_17_aarch64
          - os: ubuntu-latest
            target: x86_64-macos
            python_platform: macosx_10_9_x86_64
          - os: ubuntu-latest
            target: aarch64-macos
            python_platform: macosx_11_0_arm64
          - os: ubuntu-latest
            target: x86_64-windows-gnu
            python_platform: win_amd64
          - os: ubuntu-latest
            target: aarch64-windows-gnu
            python_platform: win_arm64

    steps:
      - uses: actions/checkout@v4

      - name: Download native library
        uses: actions/download-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: native-lib

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install build wheel

      - name: Copy native library to package
        run: |
          mkdir -p bindings/python/src/latticedb/lib
          find native-lib/lib -maxdepth 1 -type f -exec cp {} bindings/python/src/latticedb/lib/ \;
          ls -la bindings/python/src/latticedb/lib/

      - name: Build wheel
        env:
          LATTICE_NATIVE_TARGET: ${{ matrix.target }}
          LATTICE_BUNDLE_LIB_DIR: ${{ github.workspace }}/native-lib/lib
        run: |
          cd bindings/python
          python -m build --wheel

      - name: Retag wheel for platform
        run: |
          cd bindings/python
          wheel tags --platform-tag=${{ matrix.python_platform }} --remove dist/*.whl
          ls -la dist/

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: bindings/python/dist/*.whl

  # ============================================
  # Smoke test wheels
  # ============================================
  smoke-test-wheels:
    name: Smoke Test (${{ matrix.os }})
    needs: build-wheels
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux-gnu
          - os: macos-14
            target: aarch64-macos
          - os: windows-latest
            target: x86_64-windows-gnu

    steps:
      - name: Download wheel
        uses: actions/download-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install and test
        shell: bash
        run: |
          python -m venv test-env
          # Windows puts the virtualenv interpreter under Scripts/ instead.
          if [ -d test-env/Scripts ]; then
            venv_python=test-env/Scripts/python
          else
            venv_python=test-env/bin/python
          fi
          "$venv_python" -m pip install dist/*.whl

          # Opening a database, not just importing: the bundled library is
          # loaded lazily, so an import on its own would pass with no native
          # library present at all.
          "$venv_python" - <<'PY'
          import tempfile
          from pathlib import Path

          from latticedb import Database

          with tempfile.TemporaryDirectory() as tmp:
              with Database(Path(tmp) / "smoke.ltdb", create=True):
                  pass

          print("Smoke test passed")
          PY

  # ============================================
  # Build source distribution
  # ============================================
  build-sdist:
    name: Build Source Distribution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install build

      - name: Build sdist
        run: |
          cd bindings/python
          python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: bindings/python/dist/*.tar.gz

  # ============================================
  # Publish to PyPI
  # ============================================
  publish-pypi:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist, smoke-test-wheels, release-github]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_pypi)

    environment:
      name: pypi
      url: https://pypi.org/p/latticedb

    permissions:
      id-token: write  # Required for trusted publishing

    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: List distributions
        run: ls -la dist/

      - name: Check PyPI version
        id: pypi-version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi

          if python3 - "$VERSION" <<'PY'
          import sys
          import urllib.error
          import urllib.request

          version = sys.argv[1]
          try:
              urllib.request.urlopen(f"https://pypi.org/pypi/latticedb/{version}/json", timeout=10)
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  sys.exit(1)
              raise
          PY
          then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to PyPI
        if: steps.pypi-version.outputs.exists != 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  # ============================================
  # Build and publish npm package
  # Downloads all platform shared libraries and
  # bundles them into a single package for koffi
  # ============================================
  build-npm:
    name: Build npm Package
    needs: build-native
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download Linux x86_64 library
        uses: actions/download-artifact@v4
        with:
          name: native-x86_64-linux-gnu
          path: native-x86_64-linux-gnu

      - name: Download Linux aarch64 library
        uses: actions/download-artifact@v4
        with:
          name: native-aarch64-linux-gnu
          path: native-aarch64-linux-gnu

      - name: Download macOS x86_64 library
        uses: actions/download-artifact@v4
        with:
          name: native-x86_64-macos
          path: native-x86_64-macos

      - name: Download macOS aarch64 library
        uses: actions/download-artifact@v4
        with:
          name: native-aarch64-macos
          path: native-aarch64-macos

      - name: Download Windows x86_64 library
        uses: actions/download-artifact@v4
        with:
          name: native-x86_64-windows-gnu
          path: native-x86_64-windows-gnu

      - name: Download Windows aarch64 library
        uses: actions/download-artifact@v4
        with:
          name: native-aarch64-windows-gnu
          path: native-aarch64-windows-gnu

      - name: Copy shared libraries into package
        run: |
          PKG=bindings/typescript

          # linux-x64
          mkdir -p $PKG/lib/linux-x64
          cp native-x86_64-linux-gnu/lib/liblattice.so $PKG/lib/linux-x64/ || true

          # linux-arm64
          mkdir -p $PKG/lib/linux-arm64
          cp native-aarch64-linux-gnu/lib/liblattice.so $PKG/lib/linux-arm64/ || true

          # darwin-x64
          mkdir -p $PKG/lib/darwin-x64
          cp native-x86_64-macos/lib/liblattice.dylib $PKG/lib/darwin-x64/ || true

          # darwin-arm64
          mkdir -p $PKG/lib/darwin-arm64
          cp native-aarch64-macos/lib/liblattice.dylib $PKG/lib/darwin-arm64/ || true

          # win32-x64
          mkdir -p $PKG/lib/win32-x64
          cp native-x86_64-windows-gnu/lib/lattice.dll $PKG/lib/win32-x64/ || true

          # win32-arm64
          mkdir -p $PKG/lib/win32-arm64
          cp native-aarch64-windows-gnu/lib/lattice.dll $PKG/lib/win32-arm64/ || true

          echo "Bundled libraries:"
          find $PKG/lib -type f | sort

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: bindings/typescript
        run: npm ci --ignore-scripts

      - name: Build TypeScript
        working-directory: bindings/typescript
        run: npm run build

      - name: Upload npm package
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: bindings/typescript/

  # ============================================
  # Publish to npm
  # ============================================
  publish-npm:
    name: Publish to npm
    needs: [build-npm, release-github]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_npm)

    permissions:
      id-token: write  # Required for npm provenance/OIDC publishing

    steps:
      - name: Download npm package
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: bindings/typescript

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Check npm version
        id: npm-version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi

          if npm view "@hajewski/latticedb@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.npm-version.outputs.exists != 'true'
        working-directory: bindings/typescript
        run: npm ci --ignore-scripts

      - name: List bundled libraries
        if: steps.npm-version.outputs.exists != 'true'
        run: find bindings/typescript/lib -type f | sort || echo "No lib directory"

      - name: Publish to npm
        if: steps.npm-version.outputs.exists != 'true'
        working-directory: bindings/typescript
        run: npm publish --ignore-scripts --access public --provenance
